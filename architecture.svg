<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="SF Pro Display, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="900" height="700" fill="#0f1117"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600" letter-spacing="0.5">Reminders MCP Server — System Architecture</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- ZONE: USER / CLAUDE CODE -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="30" y="60" width="240" height="160" rx="12" fill="#1a1d2e" stroke="#3d4270" stroke-width="1.5"/>
  <text x="150" y="83" text-anchor="middle" fill="#7b82c4" font-size="11" font-weight="600" letter-spacing="1" text-transform="uppercase">USER LAYER</text>

  <!-- User bubble -->
  <rect x="55" y="95" width="80" height="50" rx="8" fill="#2a2d45" stroke="#4a4f80" stroke-width="1"/>
  <text x="95" y="116" text-anchor="middle" fill="#c8caf0" font-size="11">You</text>
  <text x="95" y="132" text-anchor="middle" fill="#6b7299" font-size="10">(natural lang.)</text>

  <!-- Claude Code bubble -->
  <rect x="165" y="95" width="80" height="50" rx="8" fill="#2a2d45" stroke="#4a4f80" stroke-width="1"/>
  <text x="205" y="112" text-anchor="middle" fill="#c8caf0" font-size="11">Claude Code</text>
  <text x="205" y="128" text-anchor="middle" fill="#6b7299" font-size="10">claude-sonnet</text>
  <text x="205" y="142" text-anchor="middle" fill="#6b7299" font-size="10">-4-6</text>

  <!-- Arrow: User → Claude -->
  <line x1="136" y1="120" x2="163" y2="120" stroke="#4a4f80" stroke-width="1.5" marker-end="url(#arr-dim)"/>

  <!-- MCP Config note -->
  <rect x="55" y="165" width="190" height="40" rx="6" fill="#1e2035" stroke="#2d3155" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="150" y="181" text-anchor="middle" fill="#5a6090" font-size="10">~/.claude/claude_desktop_config.json</text>
  <text x="150" y="196" text-anchor="middle" fill="#5a6090" font-size="10">registers MCP server path</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- ZONE: MCP TRANSPORT -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="310" y="60" width="280" height="160" rx="12" fill="#1a2418" stroke="#3a5030" stroke-width="1.5"/>
  <text x="450" y="83" text-anchor="middle" fill="#6aaa60" font-size="11" font-weight="600" letter-spacing="1">MCP TRANSPORT LAYER</text>

  <!-- StdioTransport box -->
  <rect x="330" y="95" width="240" height="50" rx="8" fill="#1f2e1c" stroke="#4a7040" stroke-width="1"/>
  <text x="450" y="115" text-anchor="middle" fill="#a8d4a0" font-size="11" font-weight="500">StdioTransport</text>
  <text x="450" y="132" text-anchor="middle" fill="#5a8050" font-size="10">JSON-RPC 2.0 over stdin/stdout</text>

  <!-- Protocol labels -->
  <text x="450" y="170" text-anchor="middle" fill="#4a7040" font-size="10">tool/list  •  tool/call  •  error responses</text>
  <text x="450" y="184" text-anchor="middle" fill="#3a5830" font-size="10">MCP Spec 2025-11-25</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- ZONE: MCP SERVER (main process) -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="30" y="265" width="560" height="250" rx="12" fill="#1a1820" stroke="#5a3d70" stroke-width="1.5"/>
  <text x="310" y="288" text-anchor="middle" fill="#9b72c4" font-size="11" font-weight="600" letter-spacing="1">MCP SERVER PROCESS  (Swift executable — runs on login via launchd)</text>

  <!-- main.swift -->
  <rect x="50" y="300" width="150" height="60" rx="8" fill="#251e30" stroke="#6a4d90" stroke-width="1"/>
  <text x="125" y="320" text-anchor="middle" fill="#c4a8e0" font-size="11" font-weight="500">main.swift</text>
  <text x="125" y="337" text-anchor="middle" fill="#7a5da0" font-size="10">Server init</text>
  <text x="125" y="351" text-anchor="middle" fill="#7a5da0" font-size="10">Tool registration</text>

  <!-- Tool Handlers box -->
  <rect x="225" y="300" width="180" height="120" rx="8" fill="#251e30" stroke="#6a4d90" stroke-width="1"/>
  <text x="315" y="320" text-anchor="middle" fill="#c4a8e0" font-size="11" font-weight="500">Tool Handlers</text>
  <line x1="235" y1="328" x2="395" y2="328" stroke="#3d2d50" stroke-width="1"/>
  <text x="315" y="344" text-anchor="middle" fill="#9070b8" font-size="10">create_reminder</text>
  <text x="315" y="360" text-anchor="middle" fill="#9070b8" font-size="10">list_reminders</text>
  <text x="315" y="376" text-anchor="middle" fill="#9070b8" font-size="10">update_reminder  •  delete_reminder</text>
  <text x="315" y="392" text-anchor="middle" fill="#9070b8" font-size="10">complete_reminder  •  get_reminder</text>
  <text x="315" y="408" text-anchor="middle" fill="#9070b8" font-size="10">batch ops  •  list mgmt</text>

  <!-- RemindersService Protocol -->
  <rect x="425" y="300" width="145" height="60" rx="8" fill="#251e30" stroke="#6a4d90" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="497" y="318" text-anchor="middle" fill="#c4a8e0" font-size="11" font-weight="500">RemindersService</text>
  <text x="497" y="334" text-anchor="middle" fill="#7a5da0" font-size="10">«protocol»</text>
  <text x="497" y="350" text-anchor="middle" fill="#5a3d70" font-size="10">mockable seam</text>

  <!-- ReminderDTO -->
  <rect x="225" y="440" width="180" height="55" rx="8" fill="#1e1a28" stroke="#4d3868" stroke-width="1"/>
  <text x="315" y="459" text-anchor="middle" fill="#9070b8" font-size="11" font-weight="500">ReminderDTO</text>
  <text x="315" y="475" text-anchor="middle" fill="#5a3d70" font-size="10">id · title · notes · dueDate</text>
  <text x="315" y="489" text-anchor="middle" fill="#5a3d70" font-size="10">priority · list · completed</text>

  <!-- Arrows inside server -->
  <line x1="200" y1="330" x2="223" y2="330" stroke="#6a4d90" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="405" y1="330" x2="423" y2="330" stroke="#6a4d90" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="315" y1="420" x2="315" y2="438" stroke="#4d3868" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- ZONE: EVENTKIT LAYER -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="630" y="265" width="240" height="250" rx="12" fill="#1a1f2e" stroke="#2d4a7a" stroke-width="1.5"/>
  <text x="750" y="288" text-anchor="middle" fill="#5a8ac4" font-size="11" font-weight="600" letter-spacing="1">EVENTKIT LAYER</text>

  <!-- EventKitRemindersService -->
  <rect x="648" y="300" width="204" height="60" rx="8" fill="#1e2535" stroke="#3a5d9a" stroke-width="1"/>
  <text x="750" y="320" text-anchor="middle" fill="#90b8e8" font-size="11" font-weight="500">EventKitRemindersService</text>
  <text x="750" y="337" text-anchor="middle" fill="#4a6d9a" font-size="10">implements RemindersService</text>
  <text x="750" y="352" text-anchor="middle" fill="#3a5070" font-size="10">EKEventStore wrapper</text>

  <!-- EKEventStore -->
  <rect x="648" y="380" width="204" height="55" rx="8" fill="#1a2030" stroke="#2a4060" stroke-width="1"/>
  <text x="750" y="400" text-anchor="middle" fill="#6090c0" font-size="11" font-weight="500">EKEventStore</text>
  <text x="750" y="416" text-anchor="middle" fill="#3a5070" font-size="10">Apple framework</text>
  <text x="750" y="432" text-anchor="middle" fill="#3a5070" font-size="10">permission: requestAccess</text>

  <!-- iCloud sync note -->
  <rect x="648" y="453" width="204" height="40" rx="6" fill="#141820" stroke="#1e3050" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="750" y="469" text-anchor="middle" fill="#3a5070" font-size="10">iCloud sync automatic</text>
  <text x="750" y="484" text-anchor="middle" fill="#2a3858" font-size="10">→ iPhone · iPad · Mac</text>

  <!-- Arrow: EventKitService → EKEventStore -->
  <line x1="750" y1="360" x2="750" y2="378" stroke="#3a5d9a" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Arrow: EKEventStore → iCloud -->
  <line x1="750" y1="435" x2="750" y2="451" stroke="#2a4060" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- ZONE: APPLE REMINDERS APP -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="630" y="545" width="240" height="110" rx="12" fill="#1a2018" stroke="#3a6030" stroke-width="1.5"/>
  <text x="750" y="568" text-anchor="middle" fill="#60a050" font-size="11" font-weight="600" letter-spacing="1">APPLE REMINDERS.APP</text>
  <text x="750" y="592" text-anchor="middle" fill="#4a7838" font-size="11">Reminders.app</text>
  <text x="750" y="610" text-anchor="middle" fill="#3a5828" font-size="10">reads same EKEventStore</text>
  <text x="750" y="626" text-anchor="middle" fill="#3a5828" font-size="10">changes appear instantly</text>
  <text x="750" y="642" text-anchor="middle" fill="#2a4020" font-size="10">syncs → all your Apple devices</text>

  <!-- Arrow: EKEventStore → Reminders.app (shared store) -->
  <line x1="750" y1="543" x2="750" y2="545" stroke="#3a6030" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- ZONE: TESTS -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="30" y="545" width="240" height="110" rx="12" fill="#1a1a18" stroke="#505028" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="150" y="568" text-anchor="middle" fill="#909040" font-size="11" font-weight="600" letter-spacing="1">TESTS (offline)</text>
  <rect x="50" y="580" width="200" height="58" rx="6" fill="#202018" stroke="#404020" stroke-width="1"/>
  <text x="150" y="599" text-anchor="middle" fill="#a0a050" font-size="10" font-weight="500">MockRemindersService</text>
  <text x="150" y="615" text-anchor="middle" fill="#606030" font-size="10">implements RemindersService</text>
  <text x="150" y="630" text-anchor="middle" fill="#404820" font-size="10">no EventKit · no permissions</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- FLOW ARROWS (cross-zone) -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Claude Code → StdioTransport -->
  <line x1="245" y1="120" x2="328" y2="120" stroke="#3a7030" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="287" y="113" text-anchor="middle" fill="#4a8040" font-size="9">tool call</text>

  <!-- StdioTransport → Claude Code (response) -->
  <line x1="328" y1="135" x2="245" y2="135" stroke="#3a5070" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="287" y="149" text-anchor="middle" fill="#3a5070" font-size="9">tool result</text>

  <!-- StdioTransport ↕ MCP Server -->
  <line x1="450" y1="222" x2="310" y2="310" stroke="#5a3d70" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- MCP Server → EventKitService -->
  <line x1="572" y1="360" x2="646" y2="340" stroke="#5a3d70" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="609" y="342" text-anchor="middle" fill="#6a4d90" font-size="9">calls</text>

  <!-- launchd label -->
  <rect x="310" y="545" width="290" height="45" rx="8" fill="#14121a" stroke="#3d2d50" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="455" y="563" text-anchor="middle" fill="#5a3d70" font-size="10" font-weight="500">launchd (Slice 7)</text>
  <text x="455" y="579" text-anchor="middle" fill="#3a2550" font-size="10">~/Library/LaunchAgents/  →  auto-starts server on login</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- ARROW MARKERS -->
  <!-- ─────────────────────────────────────────── -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a7030"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d5080"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6a4d90"/>
    </marker>
    <marker id="arr-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a4f80"/>
    </marker>
  </defs>

  <!-- ─────────────────────────────────────────── -->
  <!-- LEGEND -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="30" y="618" width="240" height="60" rx="8" fill="#111318" stroke="#252830" stroke-width="1"/>
  <text x="150" y="636" text-anchor="middle" fill="#404560" font-size="10" font-weight="600">LEGEND</text>
  <line x1="45" y1="650" x2="75" y2="650" stroke="#3a7030" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="80" y="654" fill="#506840" font-size="9">tool call (Claude → server)</text>
  <line x1="45" y1="666" x2="75" y2="666" stroke="#2d5080" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="80" y="670" fill="#3a5070" font-size="9">tool result (server → Claude)</text>

</svg>
